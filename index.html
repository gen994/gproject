<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Per Te</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at center, #0b0c1a 0%, #000000 100%);
      font-family: 'Arial', sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      flex-direction: column;
      text-align: center;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 48px;
      color: #ffccdd;
      animation: fadeIn 2s ease forwards;
    }

    .intro p {
      font-size: 18px;
      color: #ddd;
      margin: 10px 0;
      animation: fadeIn 2s ease forwards;
    }

    .extra-line {
      font-size: 16px;
      color: #ccc;
    }

    .button {
      margin-top: 20px;
      padding: 12px 24px;
      background: linear-gradient(145deg, #ff9ecb, #ffd5ec);
      color: #000;
      border: none;
      border-radius: 25px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 15px #ffb3d9;
    }

    .button:hover {
      background: linear-gradient(145deg, #ffd5ec, #ff9ecb);
      transform: scale(1.05);
    }

    #container {
      display: none;
      position: relative;
      width: 340px;
      height: 200px;
      background: #111;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 0 25px #f0a;
      margin-top: 30px;
      animation: fadeIn 1s ease forwards;
    }

    #message {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/FullMoon2010.jpg/640px-FullMoon2010.jpg') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      font-weight: bold;
      z-index: 1;
      color: white;
      text-shadow: 2px 2px 5px #000;
      font-family: 'Great Vibes', cursive;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <audio id="audio" loop>
    <source src="love.mp3" type="audio/mpeg">
  </audio>

  <div class="intro">
    <h1>Per la mia Piccola Luna...</h1>
    <p>In un mondo che non ci dà sempre spazio, ho trovato il mio universo nei tuoi occhi.</p>
    <p>Ti ho preparato qualcosa di speciale. <span class="extra-line">Gratta delicatamente...</span></p>
    <button class="button" onclick="startGratta()">Scopri cosa</button>
  </div>

  <div id="container">
    <div id="message">Ti amo Piccola!</div>
    <canvas width="340" height="200"></canvas>
  </div>

  <script>
    function requestFullscreen(element) {
      if (element.requestFullscreen) {
        element.requestFullscreen();
      } else if (element.webkitRequestFullscreen) {
        element.webkitRequestFullscreen();
      } else if (element.msRequestFullscreen) {
        element.msRequestFullscreen();
      }
    }

    function startGratta() {
      document.querySelector('.intro').style.display = 'none';
      document.getElementById('container').style.display = 'block';
      document.getElementById('audio').play();
      requestFullscreen(document.documentElement);
    }

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#c0c0c0';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let drawing = false;

    function startDrawing(e) {
      drawing = true;
      draw(e);
    }

    function stopDrawing() {
      drawing = false;
      ctx.beginPath();
    }

    function draw(e) {
      if (!drawing) return;

      e.preventDefault();
      let x, y;
      if (e.touches) {
        const rect = canvas.getBoundingClientRect();
        x = e.touches[0].clientX - rect.left;
        y = e.touches[0].clientY - rect.top;
      } else {
        x = e.offsetX;
        y = e.offsetY;
      }

      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 20, 0, Math.PI * 2);
      ctx.fill();
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchmove', draw);
  </script>
</body>
</html>
